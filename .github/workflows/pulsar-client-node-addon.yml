name: Pulsar client Node addon (GHCR)

run-name: Pulsar client Node addon (${{ inputs.cpp_ref || '9666a9b' }}) - By ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      cpp_repository:
        description: Git repository of the C++ client
        default: https://github.com/gusteycamargo/pulsar-client-cpp.git
      cpp_ref:
        description: Commit of the C++ client to build
        default: 9666a9b
      pulsar_client_node_version:
        description: Version of pulsar-client the addon is built for
        default: 1.17.0

  push:
    paths:
      - pulsar-client-node-addon/**
      - .github/workflows/pulsar-client-node-addon.yml

env:
  REGISTRY: ghcr.io
  CPP_REPOSITORY: ${{ inputs.cpp_repository || 'https://github.com/gusteycamargo/pulsar-client-cpp.git' }}
  CPP_REF: ${{ inputs.cpp_ref || '9666a9b' }}
  PULSAR_CLIENT_NODE_VERSION: ${{ inputs.pulsar_client_node_version || '1.17.0' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Image name and tag
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
          echo "image=${{ env.REGISTRY }}/${OWNER}/pulsar-client-node" >> "$GITHUB_OUTPUT"
          echo "tag=${PULSAR_CLIENT_NODE_VERSION}-cpp-${CPP_REF:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the addon image
        uses: docker/build-push-action@v7
        with:
          context: pulsar-client-node-addon
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=pulsar-client ${{ env.PULSAR_CLIENT_NODE_VERSION }} addon built against pulsar-client-cpp ${{ env.CPP_REF }}
          build-args: |
            CPP_REPOSITORY=${{ env.CPP_REPOSITORY }}
            CPP_REF=${{ env.CPP_REF }}
            PULSAR_CLIENT_NODE_VERSION=${{ env.PULSAR_CLIENT_NODE_VERSION }}
            BUILD_JOBS=4
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache-${{ matrix.arch }},mode=max

  manifest:
    name: Publish the multi-arch tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Join the architectures under one tag
        run: |
          set -euo pipefail
          IMAGE="${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}"
          docker buildx imagetools create -t "$IMAGE" "${IMAGE}-amd64" "${IMAGE}-arm64"
          docker buildx imagetools inspect "$IMAGE"
